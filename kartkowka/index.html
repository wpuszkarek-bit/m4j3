<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Formularz</h1>


        <form id="contactForm" action="odbierz.php" method="post" >
                <label for="name">Imię</label>
                <input type="text" id="name" name="name" required minlength="2" placeholder="Jan">

                <label for="message">Wiadomość</label>
                <textarea id="message" name="message" rows="4" placeholder="Wpisz swoją wiadomość..."></textarea>
                <button type="submit">Wyślij</button>
            
        </form>

        <div id="powitanie" class="welcome-msg"></div>
    </div>

    <script>
        document.getElementById('contactForm').addEventListener('submit', function(event) {
            let nameInput = document.getElementById('name');
            let name = nameInput.value.trim();

            if (name ===""){
                event.preventDefault();
                alert('Podaj imie!')
            }
        });
    </script>
</body>
</html>
